<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 / 注册 - 伴伴星球 Companion Planet</title>

    <style>
        /* ... CSS 样式保持不变 ... */
        /* 只需要新增一个样式来显示错误提示 */
        .error-message {
            color: #ffcccc;
            font-size: 0.9rem;
            margin-top: 5px;
            text-align: center;
        }
        /* ... CSS 样式保持不变 ... */
        /* (为保持简洁，此处省略 CSS 样式) */
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Microsoft YaHei', sans-serif;
            background-image: url('./textures/planet.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        .login-wrapper {
            position: relative;
            z-index: 2;
            width: 85%;
            max-width: 1300px;
            height: 80%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .welcome-area {
            width: 40%;
            color: #fff;
            text-shadow: 0 0 20px rgba(0,0,0,0.6);
        }

        .welcome-title {
            font-size: 3.6rem;
            font-weight: 900;
            margin-bottom: 20px;
            letter-spacing: 3px;
        }

        .welcome-sub {
            font-size: 1.2rem;
            opacity: 0.9;
            letter-spacing: 2px;
        }

        .login-box {
            width: 380px;
            background: rgba(255,255,255,0.15);
            padding: 35px 40px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.4);
            backdrop-filter: blur(10px);
            color: #fff;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            margin-top: 6px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.2);
            color: #fff;
            font-size: 1rem;
        }

        .submit-btn {
            width: 100%;
            margin-top: 25px;
            padding: 12px 0;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            background: rgba(255,255,255,0.9);
            color: #333;
            cursor: pointer;
            transition: .3s;
        }

        .submit-btn:hover {
            transform: scale(1.05);
            background: #fff;
        }

        .switch-link {
            margin-top: 15px;
            font-size: 0.9rem;
            text-align: center;
            opacity: .9;
        }

        .switch-link a {
            color: #fff;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="canvas-container"></div>

    <div class="login-wrapper">

        <div class="welcome-area">
            <div class="welcome-title">Welcome To<br>伴伴星球</div>
            <div class="welcome-sub">Companion Planet</div>
        </div>

        <div class="login-box" id="formBox">
            <h2 id="formTitle">登录 Login</h2>

            <div class="input-group">
                <label>账号 / Email</label>
                <input type="text" id="emailInput" placeholder="请输入账号">
            </div>

            <div class="input-group">
                <label>密码 Password</label>
                <input type="password" id="passwordInput" placeholder="请输入密码">
            </div>

            <div id="errorMessage" class="error-message"></div>

            <button class="submit-btn" id="submitBtn">登录</button>

            <div class="switch-link">
                还没有账号？
                <a onclick="switchForm()">注册</a>
            </div>
        </div>

    </div>

    <script>
        // 获取 DOM 元素
        const formBox = document.getElementById('formBox');
        const formTitle = document.getElementById('formTitle');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const submitBtn = document.getElementById('submitBtn');
        const errorMessageDiv = document.getElementById('errorMessage');

        // ===================================
        // 辅助函数
        // ===================================

        /** 显示错误信息 */
        function displayError(message) {
            errorMessageDiv.innerText = message;
            setTimeout(() => {
                errorMessageDiv.innerText = '';
            }, 3000); // 3秒后自动清除
        }

        /** 获取所有用户数据 (模拟数据库查询) */
        function getUsers() {
            const users = localStorage.getItem('cp_users');
            return users ? JSON.parse(users) : {}; // 返回一个对象 {email: {password: '...', ...}}
        }

        /** 存储用户数据 (模拟数据库写入) */
        function saveUser(email, password) {
            const users = getUsers();
            // 在实际项目中，密码需要进行哈希加密，这里为了演示直接存储
            users[email] = { password: password }; 
            localStorage.setItem('cp_users', JSON.stringify(users));
        }


        // ===================================
        // 表单逻辑
        // ===================================

        /** 切换登录/注册模式 */
        function switchForm() {
            errorMessageDiv.innerText = ''; // 清除错误提示
            emailInput.value = '';
            passwordInput.value = '';

            if (formTitle.innerText.includes("登录")) {
                formTitle.innerText = "注册 Register";
                submitBtn.innerText = "注册";
                formBox.querySelector(".switch-link").innerHTML = `已有账号？ <a onclick="switchForm()">登录</a>`;
            } else {
                formTitle.innerText = "登录 Login";
                submitBtn.innerText = "登录";
                formBox.querySelector(".switch-link").innerHTML = `还没有账号？ <a onclick="switchForm()">注册</a>`;
            }
        }

        /** 表单验证和提交处理 */
        function handleFormSubmission() {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            const isLogin = formTitle.innerText.includes("登录");
            const users = getUsers();

            // 1. 前端基础验证
            if (!email || !password) {
                displayError("邮箱和密码都不能为空！");
                return;
            }
            if (password.length < 6) {
                displayError("密码长度不能少于 6 位。");
                return;
            }

            if (isLogin) {
                // ------------------ 登录逻辑 ------------------
                if (!users[email]) {
                    displayError("此账号未注册！");
                } else if (users[email].password !== password) {
                    displayError("密码错误！");
                } else {
                    // 登录成功
                    displayError("✅ 登录成功！正在跳转...");
                    // 存储登录状态 (可选)
                    localStorage.setItem('isLoggedIn', 'true');
                    
                    // 跳转到选择玩偶页面
                    window.location.href = 'main.html'; 
                }
            } else {
                // ------------------ 注册逻辑 ------------------
                if (users[email]) {
                    displayError("此邮箱已被注册，请直接登录。");
                } else {
                    // 注册成功
                    saveUser(email, password);
                    displayError("🎉 注册成功！请使用新账号登录。");
                    // 自动切换到登录界面
                    setTimeout(switchForm, 1500); 
                }
            }
        }
        
        // 绑定提交按钮事件
        submitBtn.addEventListener('click', handleFormSubmission);
        // 允许按回车键提交
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleFormSubmission();
            }
        });
    </script>

    <script type="module" src="./index.js"></script>

</body>
</html>
