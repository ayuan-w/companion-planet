<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔法果园数苹果</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">魔法果园数苹果</h1>
        <div class="main-content">
            <div class="orchard" id="orchardContainer"></div>
            <div class="collection-area">
                <div class="basket" id="basket">
                    <img src="images/lanzi.png" alt="篮子">
                    <div class="collected-apples" id="collectedApples"></div>
                </div>
                <div class="feedback">你收集了 <span id="apple-count">0</span> 个苹果！</div>
            </div>
        </div>
        <!-- 庆祝动画容器 -->
        <div class="celebration" id="celebration"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
